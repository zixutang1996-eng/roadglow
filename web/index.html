<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<div id="controls">
  <button class="ctl" id="layersBtn">◩</button>
  <button class="ctl" id="compassBtn"><span id="needle">➤</span></button>
  <button class="ctl" id="locBtn">◎</button>
  <div class="zoomgrp"><button class="ctl" id="zin">＋</button><button class="ctl" id="zout">－</button></div>
</div>
<div id="layersPop" class="card hidden"></div>
<div id="navBanner" class="hidden"></div>
<div id="scrim" class="hidden"></div>
<nav id="drawer"></nav>

<script type="module" src="/src/main.js"></script>
